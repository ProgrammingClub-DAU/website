spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/cpclub_db
    username: cpclub_user
    password: cpclub_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # validate, matching production. The schema is owned by the migrations in
      # db/migration, so a local database and a deployed one are built the same
      # way — and a migration that has drifted from the entities fails here first,
      # rather than on a deploy.
      #
      # If this fails after you pull a schema change, add the new migration and
      # restart; do not switch this back to `update`, or your local schema will
      # silently diverge from everyone else's.
      #
      # If it fails the first time you pull this change, your local database was
      # built by the old `update` setting and has drifted. Local data is
      # disposable — recreate it:  docker compose down -v && docker compose up -d
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
    open-in-view: false

  flyway:
    enabled: true
    # Local databases created before Flyway existed already have these tables.
    baseline-on-migrate: true
    baseline-version: 1

app:
  jwt:
    # JWT_SECRET must be set as an environment variable in production.
    # Minimum 256-bit (64 hex chars) random string. Generate with: openssl rand -hex 32
    # If not set, the application will fail to start intentionally.
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  google:
    # The OAuth 2.0 Web client ID from Google Cloud Console. Every ID token is
    # checked to have been issued for this client, which is what stops a token
    # minted for some other site being replayed here.
    #
    # No default: if it is missing the application refuses to start, rather than
    # coming up with sign-in quietly broken.
    client-id: ${GOOGLE_CLIENT_ID}
    # Only this email domain may sign in. Google reports it twice -- as the
    # address and as the `hd` hosted-domain claim -- and both are checked.
    allowed-domain: ${GOOGLE_ALLOWED_DOMAIN:dau.ac.in}

cpclub:
  cors:
    # Set CORS_ALLOWED_ORIGINS in production to your Vercel URL.
    # Multiple origins supported as a comma-separated string.
    # Example: https://cpclub.vercel.app,http://localhost:3000
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  # ── Phase 3 additions ────────────────────────────────────────────────────────
  # All feature flags default to false. Stage 7 sets them to true in production.

  scheduling:
    # All @Scheduled crons use this zone (D1). UTC on Render without this setting
    # means the Monday snapshot fires at 05:30 IST instead of 00:00 IST.
    zone: ${CPCLUB_SCHEDULING_ZONE:Asia/Kolkata}

  codeforces:
    api-key: ${CF_API_KEY:}
    api-secret: ${CF_API_SECRET:}
    # Stage 1A submission sync. Off until Stage 7 enables it for production.
    submissions-enabled: ${CPCLUB_CF_SUBMISSIONS_ENABLED:false}

  leetcode:
    # Cron for the daily solved-total baseline snapshot. Default = 00:05 IST.
    totals-cron: "0 5 0 * * *"

  external-contests:
    # Stage 3A calendar sync. Off until Stage 7.
    enabled: ${CPCLUB_EXTERNAL_CONTESTS_ENABLED:false}
    # Fallback key for the clist.by API (D26). Not required while AtCoder/CodeChef
    # scrapers are working.
    clist-api-key: ${CLIST_API_KEY:}

  auth:
    allowed-email-domains: ${CPCLUB_AUTH_ALLOWED_EMAIL_DOMAINS:dau.ac.in}
    # Google-only sign-in (A2) already verifies the domain, so this flag is
    # informational only for Stage 0. Stage 1C may read it.
    require-email-verification: ${CPCLUB_AUTH_REQUIRE_EMAIL_VERIFICATION:false}

  mail:
    # Stage 5A/5B email reminders. Off until Stage 7.
    enabled: ${CPCLUB_MAIL_ENABLED:false}
    from: ${CPCLUB_MAIL_FROM:no-reply@localhost}
    # Signs one-click unsubscribe links (D29). Generate with: openssl rand -hex 32
    unsubscribe-secret: ${CPCLUB_UNSUBSCRIBE_SECRET:}

  public-site-url: ${CPCLUB_PUBLIC_SITE_URL:http://localhost:3000}
